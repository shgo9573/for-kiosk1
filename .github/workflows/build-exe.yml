name: Build and Release Windows EXE

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App & Bundle Server
      run: npm run build:app

    - name: Compile Windows EXE with Brotli Compression (~45MB)
      run: npx pkg dist/server.cjs --config pkg-config.json -C Brotli --targets node18-win-x64 --output dist-exe/ToraDelia-Kiosk.exe

    - name: Hide Console Window (Set Windows GUI Subsystem)
      run: node scripts/set-gui-subsystem.cjs dist-exe/ToraDelia-Kiosk.exe

    - name: Compress EXE to ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path dist-exe/ToraDelia-Kiosk.exe -DestinationPath dist-exe/ToraDelia-Kiosk-Windows.zip -Force

    - name: Upload to GitHub Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToraDelia-Kiosk-Windows-EXE
        path: |
          dist-exe/ToraDelia-Kiosk.exe
          dist-exe/ToraDelia-Kiosk-Windows.zip

    - name: Publish or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "גרסה אחרונה להורדה (Latest Windows Kiosk)"
        body: |
          עמדת תורה דיליה עבור Windows - גרסה עצמאית ונקייה ללא חלון שחור (Windowed GUI Kiosk).
          
          ### הוראות הפעלה:
          1. הורידו את **ToraDelia-Kiosk.exe** (או את קובץ ה-ZIP).
          2. לחצו לחיצה כפולה על **ToraDelia-Kiosk.exe**.
          3. חלון עמדת תורה דיליה ייפתח מיד כחלון אפליקציה ייעודי ונקי, ללא חלון קונסולה שחור.
        files: |
          dist-exe/ToraDelia-Kiosk.exe
          dist-exe/ToraDelia-Kiosk-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
