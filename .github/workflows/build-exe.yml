name: Build Standalone Windows EXE (130MB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App & Bundle Server
      run: npm run build:app

    - name: Build Standalone EXE (~130MB with Chromium Engine Embedded)
      run: npx electron-builder --win portable --x64

    - name: Verify Output File Exists
      shell: pwsh
      run: |
        Get-ChildItem -Path dist-electron -Filter "*.exe" | ForEach-Object {
          Write-Host "Generated EXE: $($_.FullName) - Size: $([math]::Round($_.Length / 1MB, 2)) MB"
        }

    - name: Upload EXE to GitHub Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToraDelia-Kiosk-Windows-EXE
        path: dist-electron/ToraDelia-Kiosk.exe

    - name: Publish EXE to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "תורה דיליה - גרסה עצמאית מלאה (Standalone 130MB)"
        body: |
          ## עמדת תורה דיליה - קובץ EXE עצמאי מלא (130MB)
          
          קובץ יחיד להפעלה מיידית בלחיצה כפולה.
          
          * **מנוע מלא:** כולל מנוע Chromium ו-Node.js שלם מקומפל בתוך הקובץ.
          * **ללא תלות בדפדפן:** לא דורש Microsoft Edge או כל דפדפן אחר המותקן במחשב.
          * **ללא צורך בהתקנה:** קובץ EXE בודד שרץ ישירות במסך מלא נעול (Kiosk).
          * מתאים במיוחד לעמדות סייפר (Safer) ולמחשבים ללא גישה לאינטרנט.
        files: |
          dist-electron/ToraDelia-Kiosk.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
