name: Build and Commit Windows EXE

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-commit:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App & Bundle Server
      run: npm run build:app

    - name: Compile to Windows EXE using pkg
      run: npx pkg . --targets node18-win-x64 --output dist-exe/ToraDelia-Kiosk.exe

    - name: Commit and Push EXE to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add dist-exe/ToraDelia-Kiosk.exe
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build Windows EXE [skip ci]"
        git push
