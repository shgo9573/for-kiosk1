name: Build Standalone Windows EXE (130MB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App & Bundle Server
      run: npm run build:app

    - name: Build Standalone Windows Packages (~130MB with Embedded Chromium)
      run: npx electron-builder --win --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Compress Unpacked Folder to ZIP
      shell: pwsh
      run: |
        if (Test-Path "dist-electron/win-unpacked") {
          Compress-Archive -Path "dist-electron/win-unpacked/*" -DestinationPath "dist-electron/ToraDelia-Kiosk-Windows.zip" -Force
        }

    - name: Verify Output Files
      shell: pwsh
      run: |
        Get-ChildItem -Path dist-electron | ForEach-Object {
          Write-Host "Output: $($_.Name) - Size: $([math]::Round($_.Length / 1MB, 2)) MB"
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToraDelia-Kiosk-Windows
        path: |
          dist-electron/ToraDelia-Kiosk.exe
          dist-electron/ToraDelia-Kiosk-Setup.exe
          dist-electron/ToraDelia-Kiosk-Windows.zip

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "תורה דיליה - גרסה עצמאית מלאה (Standalone 130MB)"
        body: |
          ## עמדת תורה דיליה - גרסה עצמאית מלאה (130MB)
          
          כל הקבצים כוללים מנוע Chromium ושרת שלם מקומפלים פנימה - **ללא צורך ב-Microsoft Edge וללא צורך באינטרנט!**
          
          ### 📥 קבצים להורדה לבחירתך:
          
          1. **`ToraDelia-Kiosk.exe`** (מומלץ):
             * קובץ EXE בודד ועצמאי (Portable) להפעלה מיידית ללא התקנה.
             * כולל מנגנון רישום לוגים אוטומטי (`kiosk-debug.log`).
          
          2. **`ToraDelia-Kiosk-Setup.exe`**:
             * מתקין רשמי של Windows (לחיצה אחת והתוכנה מותקנת עם קיצור דרך על שולחן העבודה).
             * מומלץ למחשבי סייפר (Safer) החוסמים הפעלה מתיקיות זמניות.
          
          3. **`ToraDelia-Kiosk-Windows.zip`**:
             * תיקייה מלאה פרוסה. פשוט מחלצים לכל מקום (או לדיסק און קי) ומפעילים ישירות את `ToraDelia-Kiosk.exe` ללא התקנה וללא חילוץ זמני.
        files: |
          dist-electron/ToraDelia-Kiosk.exe
          dist-electron/ToraDelia-Kiosk-Setup.exe
          dist-electron/ToraDelia-Kiosk-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
