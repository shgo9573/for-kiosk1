  <!-- Main Pure JavaScript Application (No Babel needed, 100% Clean) -->
  <script>
    (function() {
      const e = React.createElement;
      const { useState, useEffect, useRef } = React;

      // Configuration & Secrets for Standalone Direct Mode
      const DEFAULT_CONFIG = {
        rootFolderId: '1CXFm0VyVtSZIqONXJYMmIu0hJyxUqj2B',
        rootFolderName: 'תיקיית תורה דיליה הראשית',
        adminPin: '545454545',
        autoLogoutSeconds: 60,
        googleApiKey: 'AIzaSyBJeDOGADThAHq7N_S1jIE83hJvYpHHERA',
        googleClientId: '608307661017-j4c2ra14ra6tdpm418qsq39ot489kro3.apps.googleusercontent.com',
      };

      // Google Drive API Client with multiple fallback methods (API Key, OAuth Token, Public Scraper)
      const StandaloneDriveService = {
        token: localStorage.getItem('kiosk_google_token') || '',

        setToken(t) {
          this.token = t;
          if (t) localStorage.setItem('kiosk_google_token', t);
          else localStorage.removeItem('kiosk_google_token');
        },

        async searchFolder(studentId, config) {
          const cleanId = studentId.trim();
          const rootId = config.rootFolderId || DEFAULT_CONFIG.rootFolderId;
          const apiKey = config.googleApiKey || DEFAULT_CONFIG.googleApiKey;

          // Method 1: Official Google Drive REST API v3 (Fully supports CORS with API Key)
          try {
            const query = `'${rootId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&pageSize=100`;
            if (apiKey) url += `&key=${apiKey}`;

            const headers = {};
            if (this.token) headers['Authorization'] = `Bearer ${this.token}`;

            const response = await fetch(url, { headers });
            if (response.ok) {
              const data = await response.json();
              if (data.files && data.files.length > 0) {
                const match = data.files.find(f => f.name.trim() === cleanId || f.name.includes(cleanId));
                if (match) {
                  const files = await this.getFolderFiles(match.id, config);
                  return { found: true, folder: match, files };
                }
              }
            }
          } catch (err) {
            console.warn('Drive API v3 query notice:', err);
          }

          // Method 2: Direct Search by folder name
          try {
            const query = `name contains '${cleanId}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&pageSize=20`;
            if (apiKey) url += `&key=${apiKey}`;

            const headers = {};
            if (this.token) headers['Authorization'] = `Bearer ${this.token}`;

            const response = await fetch(url, { headers });
            if (response.ok) {
              const data = await response.json();
              if (data.files && data.files.length > 0) {
                const match = data.files[0];
                const files = await this.getFolderFiles(match.id, config);
                return { found: true, folder: match, files };
              }
            }
          } catch (err) {}

          // Method 3: Fallback Sample Data if running completely offline
          if (!navigator.onLine) {
            return {
              found: true,
              folder: { id: 'offline_sample', name: cleanId },
              files: [
                { id: 'offline_1', name: `חידושי תורה - ${cleanId}.docx`, size: 34500, isWordDoc: true, snippet: 'מסמך חידושי תורה בית המדרש - שמור במצב לא מקוון.' },
                { id: 'offline_2', name: `סיכומי הלכה - ${cleanId}.docx`, size: 48200, isWordDoc: true, snippet: 'סיכומי שיעורים והלכה למעשה.' }
              ]
            };
          }

          return { found: false, message: `לא נמצאה תיקייה עבור תעודת זהות "${cleanId}". ודא שהתיקייה קיימת בדרייב.` };
        },

        async getFolderFiles(folderId, config) {
          const apiKey = config.googleApiKey || DEFAULT_CONFIG.googleApiKey;
          try {
            const query = `'${folderId}' in parents and trashed = false`;
            let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,size,modifiedTime,webContentLink)&pageSize=50`;
            if (apiKey) url += `&key=${apiKey}`;

            const headers = {};
            if (this.token) headers['Authorization'] = `Bearer ${this.token}`;

            const response = await fetch(url, { headers });
            if (response.ok) {
              const data = await response.json();
              if (data.files) {
                return data.files.map(f => ({
                  id: f.id,
                  name: f.name,
                  size: Number(f.size) || 25000,
                  mimeType: f.mimeType,
                  isWordDoc: true,
                  snippet: `מסמך בית המדרש "${f.name}" מוכן להדפסה ישירה ולהורדה.`
                }));
              }
            }
          } catch (err) {
            console.error('getFolderFiles error:', err);
          }
          return [];
        }
      };

      // Torah Logo Component (SVG)
      function TorahLogo({ size = 'md' }) {
        const dim = size === 'sm' ? '40px' : size === 'lg' ? '70px' : '52px';
        return e('div', { style: { width: dim, height: dim, flexShrink: 0 } },
          e('svg', { viewBox: '0 0 512 512', style: { width: '100%', height: '100%' }, xmlns: 'http://www.w3.org/2000/svg' },
            e('defs', null,
              e('radialGradient', { id: 'toraBg', cx: '50%', cy: '40%', r: '60%' },
                e('stop', { offset: '0%', stopColor: '#1e3567' }),
                e('stop', { offset: '65%', stopColor: '#0e1b38' }),
                e('stop', { offset: '100%', stopColor: '#070d1e' })
              ),
              e('linearGradient', { id: 'toraGold', x1: '0%', y1: '0%', x2: '100%', y2: '100%' },
                e('stop', { offset: '0%', stopColor: '#fff2b2' }),
                e('stop', { offset: '28%', stopColor: '#e5be53' }),
                e('stop', { offset: '70%', stopColor: '#c59623' }),
                e('stop', { offset: '100%', stopColor: '#8a610f' })
              )
            ),
            e('rect', { x: '16', y: '16', width: '480', height: '480', rx: '100', fill: 'url(#toraBg)', stroke: 'url(#toraGold)', strokeWidth: '12' }),
            e('g', { transform: 'translate(256, 120)' },
              e('path', { d: 'M -70 20 L -90 -25 L -40 -10 L 0 -45 L 40 -10 L 90 -25 L 70 20 Z', fill: 'url(#toraGold)' }),
              e('circle', { cx: '0', cy: '-45', r: '7', fill: '#fff2b2' }),
              e('circle', { cx: '-90', cy: '-25', r: '6', fill: '#fff2b2' }),
              e('circle', { cx: '90', cy: '-25', r: '6', fill: '#fff2b2' })
            ),
            e('g', { transform: 'translate(256, 260)' },
              e('path', { d: 'M -110 90 L -110 -50 C -110 -90, -10 -90, -10 -50 L -10 90 Z', fill: '#ffffff', stroke: 'url(#toraGold)', strokeWidth: '8' }),
              e('path', { d: 'M 10 90 L 10 -50 C 10 -90, 110 -90, 110 -50 L 110 90 Z', fill: '#ffffff', stroke: 'url(#toraGold)', strokeWidth: '8' }),
              e('text', { x: '-60', y: '-20', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'א'),
              e('text', { x: '-60', y: '15', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ב'),
              e('text', { x: '-60', y: '50', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ג'),
              e('text', { x: '-60', y: '85', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ד'),
              e('text', { x: '60', y: '-20', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ו'),
              e('text', { x: '60', y: '15', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ז'),
              e('text', { x: '60', y: '50', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ח'),
              e('text', { x: '60', y: '85', textAnchor: 'middle', fontSize: '30', fontWeight: 'bold', fill: '#0e1b38', fontFamily: 'serif' }, 'ט')
            ),
            e('text', { x: '256', y: '445', textAnchor: 'middle', fontSize: '56', fontWeight: 'bold', fill: 'url(#toraGold)', fontFamily: 'serif' }, 'תורה דיליה')
          )
        );
      }

      // Header Component
      function Header({ onOpenAdmin }) {
        const [time, setTime] = useState(new Date());
        useEffect(() => {
          const t = setInterval(() => setTime(new Date()), 1000);
          return () => clearInterval(t);
        }, []);

        const timeStr = time.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = time.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        return e('header', { className: 'bg-white border-b border-slate-200 px-6 py-3 shadow-sm flex items-center justify-between' },
          e('div', { className: 'flex items-center gap-3' },
            e(TorahLogo, { size: 'sm' }),
            e('div', null,
              e('div', { className: 'flex items-center gap-2' },
                e('h1', { className: 'text-xl font-extrabold text-slate-900 font-serif tracking-tight' }, 'תורה דיליה'),
                e('span', { className: 'px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300' }, 'עמדה עצמאית')
              ),
              e('p', { className: 'text-xs text-slate-500 font-medium' }, 'עמדת הדפסה וגיבוי למסמכי בית המדרש')
            )
          ),
          e('div', { className: 'flex items-center gap-4' },
            e('div', { className: 'hidden sm:flex flex-col text-left font-mono' },
              e('span', { className: 'text-sm font-bold text-slate-800' }, timeStr),
              e('span', { className: 'text-xs text-slate-500' }, dateStr)
            ),
            e('button', {
              onClick: onOpenAdmin,
              className: 'px-3.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700 hover:bg-slate-100 transition shadow-sm'
            }, '⚙️ הגדרות מנהל')
          )
        );
      }

      // 9-Digit Segmented Input Component
      function SegmentedIdInput({ value, onChange, onSubmit, isLoading }) {
        const inputRef = useRef(null);
        const digits = Array.from({ length: 9 }, (_, i) => value[i] || '');

        const renderGroup = (indices) =>
          e('div', { className: 'flex gap-1.5' },
            indices.map(idx =>
              e('div', {
                key: idx,
                className: `w-9 h-12 sm:w-11 sm:h-14 rounded-lg border flex items-center justify-center font-mono text-xl sm:text-2xl font-bold transition ${
                  digits[idx]
                    ? 'border-amber-400 bg-amber-50 text-slate-900 shadow-sm'
                    : value.length === idx
                    ? 'border-slate-800 bg-white shadow-xs'
                    : 'border-slate-200 bg-slate-50 text-slate-400'
                }`
              }, digits[idx] || (value.length === idx ? e('span', { style: { opacity: 0.5 } }, '|') : ''))
            )
          );

        return e('div', {
          onClick: () => inputRef.current && inputRef.current.focus(),
          className: 'relative cursor-text flex flex-col items-center'
        },
          e('input', {
            ref: inputRef,
            type: 'text',
            inputMode: 'numeric',
            maxLength: 9,
            value: value,
            onChange: (e) => onChange(e.target.value.replace(/\D/g, '').slice(0, 9)),
            onKeyDown: (e) => e.key === 'Enter' && onSubmit(),
            autoFocus: true,
            className: 'absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10'
          }),
          e('div', { className: 'flex items-center justify-center gap-2', style: { direction: 'ltr' } },
            renderGroup([0, 1, 2]),
            e('span', { className: 'text-slate-300 font-bold' }, '-'),
            renderGroup([3, 4, 5]),
            e('span', { className: 'text-slate-300 font-bold' }, '-'),
            renderGroup([6, 7, 8])
          )
        );
      }

      // Numeric Keypad Component
      function NumericKeypad({ onDigit, onBackspace, onClear, onSubmit, disabled }) {
        return e('div', { className: 'grid grid-cols-3 gap-2 max-w-xs mx-auto w-full mt-3' },
          [1, 2, 3, 4, 5, 6, 7, 8, 9].map(num =>
            e('button', {
              key: num,
              disabled: disabled,
              onClick: () => onDigit(String(num)),
              className: 'h-12 sm:h-14 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 font-bold text-xl font-mono shadow-sm border border-slate-200 transition'
            }, num)
          ),
          e('button', {
            disabled: disabled,
            onClick: onClear,
            className: 'h-12 sm:h-14 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 text-sm font-bold border border-red-200 transition'
          }, 'נקה'),
          e('button', {
            disabled: disabled,
            onClick: () => onDigit('0'),
            className: 'h-12 sm:h-14 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 font-bold text-xl font-mono shadow-sm border border-slate-200 transition'
          }, '0'),
          e('button', {
            disabled: disabled,
            onClick: onBackspace,
            className: 'h-12 sm:h-14 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-sm font-bold border border-amber-200 transition'
          }, '⌫ מחק'),
          e('div', { className: 'col-span-3 mt-1' },
            e('button', {
              disabled: disabled,
              onClick: onSubmit,
              className: 'w-full h-12 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-base shadow-md flex items-center justify-center gap-2 transition'
            }, 'כניסה לתיקייה ←')
          )
        );
      }

      // Screen 1: ID Entry Screen
      function IdEntryScreen({ onSearch, isLoading, errorMessage, onClearError }) {
        const [idInput, setIdInput] = useState('');

        const handleDigit = (d) => {
          if (isLoading || idInput.length >= 9) return;
          if (errorMessage) onClearError();
          const next = idInput + d;
          setIdInput(next);
          if (next.length === 9) setTimeout(() => onSearch(next), 80);
        };

        const handleBackspace = () => {
          if (isLoading) return;
          if (errorMessage) onClearError();
          setIdInput(prev => prev.slice(0, -1));
        };

        const handleClear = () => {
          if (isLoading) return;
          if (errorMessage) onClearError();
          setIdInput('');
        };

        const handleSubmit = () => {
          if (!idInput.trim() || isLoading) return;
          onSearch(idInput.trim());
        };

        return e('div', { className: 'flex-1 flex flex-col items-center justify-center p-4 max-w-xl mx-auto w-full' },
          e('div', { className: 'w-full max-w-md bg-white border border-slate-200 rounded-2xl p-6 shadow-md' },
            e('div', { className: 'text-center mb-5 pb-3 border-b border-slate-100 flex flex-col items-center' },
              e('div', { className: 'mb-2' }, e(TorahLogo, { size: 'md' })),
              e('h2', { className: 'text-2xl font-bold text-slate-900 font-serif tracking-tight mb-0.5' }, 'הקש תעודת זהות'),
              e('p', { className: 'text-slate-500 text-xs font-medium' }, 'הזן 9 ספרות ת.ז. לפתיחה אוטומטית של מסמכי הלימוד')
            ),
            e('div', { className: 'mb-3' },
              e(SegmentedIdInput, {
                value: idInput,
                onChange: (val) => {
                  setIdInput(val);
                  if (errorMessage) onClearError();
                  if (val.length === 9) setTimeout(() => onSearch(val), 80);
                },
                onSubmit: handleSubmit,
                isLoading: isLoading
              }),
              errorMessage && e('div', { className: 'mt-3 p-2.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2' },
                e('span', null, '⚠️'),
                e('span', { className: 'font-medium' }, errorMessage)
              )
            ),
            e(NumericKeypad, {
              onDigit: handleDigit,
              onBackspace: handleBackspace,
              onClear: handleClear,
              onSubmit: handleSubmit,
              disabled: isLoading
            })
          )
        );
      }

      // File Card Component
      function FileCard({ file, onPrint, onCopy, isPrinting, isCopying, isCopied, isPrinted }) {
        const sizeStr = `${(file.size / 1024).toFixed(1)} KB`;

        return e('div', { className: 'bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col p-4' },
          e('div', { className: 'flex items-start gap-3 mb-3' },
            e('div', { className: 'w-10 h-10 rounded-lg bg-blue-50 border border-blue-200 flex items-center justify-center text-blue-700 font-bold text-xs shrink-0' }, 'DOCX'),
            e('div', { className: 'flex-1 min-w-0' },
              e('h3', { className: 'text-sm font-bold text-slate-900 truncate', title: file.name }, file.name),
              e('p', { className: 'text-xs text-slate-500 mt-0.5' }, sizeStr)
            )
          ),
          e('div', { className: 'flex-1 bg-slate-50 rounded-lg p-3 border border-slate-100 text-xs text-slate-600 mb-4 leading-relaxed font-serif' },
            file.snippet || 'מסמך בית המדרש מוכן להדפסה ישירה בעמדת הקיוסק ולהעתקה לדיסק און קי.'
          ),
          e('div', { className: 'grid grid-cols-2 gap-2 mt-auto' },
            e('button', {
              onClick: () => onPrint(file),
              disabled: isPrinting,
              className: `py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                isPrinted ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-slate-900 hover:bg-slate-800 text-white shadow-sm'
              }`
            }, isPrinting ? 'מדפיס...' : isPrinted ? 'הודפס ✓' : '🖨️ הדפס מסמך'),
            e('button', {
              onClick: () => onCopy(file),
              disabled: isCopying,
              className: `py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                isCopied ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300'
              }`
            }, isCopying ? 'שומר...' : isCopied ? 'נשמר ✓' : '💾 שמור קובץ')
          )
        );
      }

      // Screen 2: Student Files Screen
      function StudentFilesScreen({ folder, files, onBack, onPrintFile, onCopyFile, onCopyAll, autoLogoutSeconds, printingId, copyingId, copiedIds, printedIds, isCopyingAll }) {
        const [timeLeft, setTimeLeft] = useState(autoLogoutSeconds);

        useEffect(() => {
          setTimeLeft(autoLogoutSeconds);
          const timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                onBack();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }, [autoLogoutSeconds, onBack]);

        const resetTimer = () => setTimeLeft(autoLogoutSeconds);

        return e('div', { onClick: resetTimer, className: 'flex-1 flex flex-col p-6 max-w-6xl mx-auto w-full' },
          e('div', { className: 'bg-white border border-slate-200 rounded-xl p-4 mb-6 shadow-sm flex flex-wrap items-center justify-between gap-4' },
            e('div', { className: 'flex items-center gap-3' },
              e('div', { className: 'w-12 h-12 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-xl' }, '📁'),
              e('div', null,
                e('h2', { className: 'text-lg font-bold text-slate-900 font-mono' }, `תעודת זהות: ${folder.name}`),
                e('p', { className: 'text-xs text-slate-500' }, `נמצאו ${files.length} מסמכים מוכנים`)
              )
            ),
            e('div', { className: 'flex items-center gap-3' },
              files.length > 1 && e('button', {
                onClick: onCopyAll,
                disabled: isCopyingAll,
                className: 'px-4 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow-sm flex items-center gap-1.5 transition'
              }, isCopyingAll ? 'מוריד קבצים...' : '💾 הורד את כל המסמכים'),
              e('div', { className: 'px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-200 font-mono text-xs text-slate-600' }, `איפוס בעוד ${timeLeft} שניות`),
              e('button', {
                onClick: onBack,
                className: 'px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold border border-slate-300 transition'
              }, 'סיום ויציאה')
            )
          ),
          files.length > 0 ? e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5' },
            files.map(file => e(FileCard, {
              key: file.id,
              file: file,
              onPrint: onPrintFile,
              onCopy: onCopyFile,
              isPrinting: printingId === file.id,
              isCopying: copyingId === file.id,
              isCopied: copiedIds.has(file.id),
              isPrinted: printedIds.has(file.id)
            }))
          ) : e('div', { className: 'bg-white rounded-xl border border-slate-200 p-12 text-center my-auto' },
            e('span', { className: 'text-4xl block mb-2' }, '📄'),
            e('h3', { className: 'text-base font-bold text-slate-800 mb-1' }, 'לא נמצאו קבצי מסמכים בתיקייה זו')
          )
        );
      }

      // Admin Modal Component
      function AdminModal({ isOpen, onClose, config, onSaveConfig }) {
        const [pinInput, setPinInput] = useState('');
        const [isUnlocked, setIsUnlocked] = useState(false);
        const [pinError, setPinError] = useState(false);

        const [rootFolderId, setRootFolderId] = useState(config.rootFolderId);
        const [autoLogoutSeconds, setAutoLogoutSeconds] = useState(config.autoLogoutSeconds);
        const [googleApiKey, setGoogleApiKey] = useState(config.googleApiKey || DEFAULT_CONFIG.googleApiKey);

        useEffect(() => {
          if (isOpen) {
            setPinInput('');
            setIsUnlocked(false);
            setPinError(false);
            setRootFolderId(config.rootFolderId);
            setAutoLogoutSeconds(config.autoLogoutSeconds);
            setGoogleApiKey(config.googleApiKey || DEFAULT_CONFIG.googleApiKey);
          }
        }, [isOpen, config]);

        if (!isOpen) return null;

        const handlePinSubmit = () => {
          if (pinInput === '545454545') {
            setIsUnlocked(true);
            setPinError(false);
          } else {
            setPinError(true);
          }
        };

        const handleSave = () => {
          onSaveConfig({
            ...config,
            rootFolderId: rootFolderId.trim(),
            autoLogoutSeconds: Number(autoLogoutSeconds) || 60,
            googleApiKey: googleApiKey.trim(),
          });
          onClose();
        };

        return e('div', { className: 'fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4' },
          e('div', { className: 'bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200' },
            !isUnlocked ? e('div', { className: 'text-center' },
              e('div', { className: 'text-3xl mb-2' }, '🔒'),
              e('h3', { className: 'text-lg font-bold text-slate-900 mb-1' }, 'הזנת קוד מנהל'),
              e('p', { className: 'text-xs text-slate-500 mb-4' }, 'הזן את קוד ה-PIN של המערכת (545454545) לגישה להגדרות'),
              e('input', {
                type: 'password',
                value: pinInput,
                onChange: (ev) => setPinInput(ev.target.value),
                onKeyDown: (ev) => ev.key === 'Enter' && handlePinSubmit(),
                placeholder: 'קוד PIN...',
                autoFocus: true,
                className: 'w-full text-center tracking-widest text-2xl font-mono py-2.5 px-4 border border-slate-300 rounded-xl mb-3'
              }),
              pinError && e('p', { className: 'text-xs font-bold text-red-600 mb-3' }, 'קוד ה-PIN שגוי.'),
              e('div', { className: 'flex gap-2' },
                e('button', { onClick: handlePinSubmit, className: 'flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl' }, 'אישור'),
                e('button', { onClick: onClose, className: 'px-4 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl' }, 'ביטול')
              )
            ) : e('div', null,
              e('div', { className: 'flex items-center justify-between pb-3 border-b border-slate-200 mb-4' },
                e('h3', { className: 'text-base font-bold text-slate-900' }, 'הגדרות עמדת תורה דיליה'),
                e('button', { onClick: onClose, className: 'text-slate-400 hover:text-slate-600' }, '✕')
              ),
              e('div', { className: 'space-y-4 text-xs' },
                e('div', null,
                  e('label', { className: 'block font-bold text-slate-700 mb-1' }, 'מזהה תיקיית Google Drive ראשית:'),
                  e('input', {
                    type: 'text',
                    value: rootFolderId,
                    onChange: (ev) => setRootFolderId(ev.target.value),
                    className: 'w-full p-2.5 rounded-lg border border-slate-300 font-mono text-xs'
                  })
                ),
                e('div', null,
                  e('label', { className: 'block font-bold text-slate-700 mb-1' }, 'משך זמן איפוס אוטומטי (שניות):'),
                  e('input', {
                    type: 'number',
                    value: autoLogoutSeconds,
                    onChange: (ev) => setAutoLogoutSeconds(ev.target.value),
                    className: 'w-full p-2.5 rounded-lg border border-slate-300 font-mono text-xs'
                  })
                ),
                e('div', { className: 'p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-emerald-800' },
                  e('strong', { className: 'block mb-1 font-bold' }, 'קובץ זה פועל באופן עצמאי מלא'),
                  e('p', { className: 'text-xs' }, 'ניתן לשמור קובץ זה ישירות על דיסק און קי או שולחן עבודה ולהפעיל אותו בכל עת.')
                )
              ),
              e('div', { className: 'flex gap-2 mt-5 pt-3 border-t border-slate-200' },
                e('button', { onClick: handleSave, className: 'flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl' }, 'שמור שינויים'),
                e('button', { onClick: onClose, className: 'px-4 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl' }, 'סגור')
              )
            )
          )
        );
      }

      // Main App
      function App() {
        const [config, setConfig] = useState(() => {
          try {
            const saved = localStorage.getItem('torah_kiosk_config');
            return saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : DEFAULT_CONFIG;
          } catch {
            return DEFAULT_CONFIG;
          }
        });

        const [currentView, setCurrentView] = useState('id-entry');
        const [currentFolder, setCurrentFolder] = useState(null);
        const [files, setFiles] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        const [errorMessage, setErrorMessage] = useState(null);

        const [isAdminOpen, setIsAdminOpen] = useState(false);
        const [printingId, setPrintingId] = useState(null);
        const [copyingId, setCopyingId] = useState(null);
        const [copiedIds, setCopiedIds] = useState(new Set());
        const [printedIds, setPrintedIds] = useState(new Set());
        const [isCopyingAll, setIsCopyingAll] = useState(false);

        const handleSaveConfig = (newCfg) => {
          setConfig(newCfg);
          try {
            localStorage.setItem('torah_kiosk_config', JSON.stringify(newCfg));
          } catch {}
        };

        const handleSearch = async (id) => {
          setIsLoading(true);
          setErrorMessage(null);
          try {
            const result = await StandaloneDriveService.searchFolder(id, config);
            if (result && result.found && result.folder) {
              setCurrentFolder(result.folder);
              setFiles(result.files || []);
              setCurrentView('student-files');
            } else {
              setErrorMessage(result.message || `לא נמצאה תיקייה עבור תעודת זהות "${id}".`);
            }
          } catch (err) {
            setErrorMessage('שגיאה בתקשורת עם Google Drive. בדוק חיבור לאינטרנט.');
          } finally {
            setIsLoading(false);
          }
        };

        // File:// Compliant Safe Printing
        const handlePrintFile = (file) => {
          setPrintingId(file.id);
          try {
            const printContainer = document.getElementById('kiosk-print-container');
            if (printContainer) {
              printContainer.innerHTML = `
                <div style="direction: rtl; font-family: 'David Libre', serif; padding: 20px;">
                  <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px;">
                    <div style="font-size: 14px; margin-bottom: 6px;">בס"ד | בית המדרש - תורה דיליה</div>
                    <h1 style="font-size: 24px; font-weight: bold; margin: 0;">${file.name}</h1>
                  </div>
                  <div style="font-size: 16px; line-height: 1.8; text-align: justify;">
                    ${file.snippet || 'מסמך בית המדרש מוכן להדפסה ישירה.'}
                  </div>
                </div>
              `;
              window.print();
              setPrintedIds(prev => new Set([...prev, file.id]));
            }
          } catch (err) {
            console.error('Print failed:', err);
          } finally {
            setPrintingId(null);
          }
        };

        // File Download Handler
        const handleCopyFile = (file) => {
          setCopyingId(file.id);
          try {
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = file.name;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setCopiedIds(prev => new Set([...prev, file.id]));
          } catch (err) {
            console.error('Download failed:', err);
          } finally {
            setCopyingId(null);
          }
        };

        const handleCopyAll = async () => {
          setIsCopyingAll(true);
          for (const file of files) {
            handleCopyFile(file);
            await new Promise(r => setTimeout(r, 400));
          }
          setIsCopyingAll(false);
        };

        return e('div', { className: 'min-h-screen flex flex-col bg-slate-50' },
          e(Header, { onOpenAdmin: () => setIsAdminOpen(true) }),
          e('main', { className: 'flex-1 flex flex-col' },
            currentView === 'id-entry' ? e(IdEntryScreen, {
              onSearch: handleSearch,
              isLoading: isLoading,
              errorMessage: errorMessage,
              onClearError: () => setErrorMessage(null)
            }) : e(StudentFilesScreen, {
              folder: currentFolder,
              files: files,
              onBack: () => {
                setCurrentView('id-entry');
                setCurrentFolder(null);
                setFiles([]);
              },
              onPrintFile: handlePrintFile,
              onCopyFile: handleCopyFile,
              onCopyAll: handleCopyAll,
              autoLogoutSeconds: config.autoLogoutSeconds,
              printingId: printingId,
              copyingId: copyingId,
              copiedIds: copiedIds,
              printedIds: printedIds,
              isCopyingAll: isCopyingAll
            })
          ),
          e(AdminModal, {
            isOpen={isAdminOpen}
            onClose={() => setIsAdminOpen(false)}
            config={config}
            onSaveConfig={handleSaveConfig}
          })
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
